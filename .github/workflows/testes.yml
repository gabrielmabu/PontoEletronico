name: Testes
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node teste-escala-turnos.js
      - run: node apps-script/tests/teste-calculo.js
      - run: node apps-script/tests/teste-contatos.js
