name: Vigia de regras trabalhistas
on:
  schedule:
    - cron: '0 11 * * 1'      # toda segunda, 8h em Brasília
  workflow_dispatch: {}        # botão "Run workflow" para testar na hora
permissions:
  contents: write
  issues: write
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Procurar novidades
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/vigia.mjs
      - name: Guardar o que já foi visto
        run: |
          if [ -n "$(git status --porcelain regras/vigia-estado.json)" ]; then
            git config user.name "vigia-regras"
            git config user.email "vigia-regras@users.noreply.github.com"
            git add regras/vigia-estado.json
            git commit -m "Vigia: atualiza itens já vistos"
            git push
          fi
