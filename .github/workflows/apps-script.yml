name: Publicar backend (Apps Script)
# Todo merge na main que mexer em apps-script/ roda os testes e publica o backend na MESMA implantação (a URL do app não muda).
# A publicação precisa de 2 segredos no GitHub (Settings > Secrets and variables > Actions): CLASPRC_JSON e DEPLOYMENT_ID.
# Sem eles, só os testes rodam (com um aviso). Passo a passo em apps-script/LEIAME.md.
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch: {}
concurrency:
  group: apps-script
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Testes do backend (se falhar, não publica)
        run: |
          node apps-script/tests/teste-calculo.js
          node apps-script/tests/teste-contatos.js
      - name: Conferir segredos
        id: seg
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Publicação automática DESLIGADA: faltam os segredos CLASPRC_JSON e/ou DEPLOYMENT_ID (veja apps-script/LEIAME.md). Os testes passaram."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar clasp
        if: steps.seg.outputs.ok == 'true'
        run: npm install -g @google/clasp@3.3.0
      - name: Publicar
        if: steps.seg.outputs.ok == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cd apps-script
          clasp push -f
          clasp deploy -i "$DEPLOYMENT_ID" -d "github ${GITHUB_SHA::7}"
          rm -f "$HOME/.clasprc.json"
